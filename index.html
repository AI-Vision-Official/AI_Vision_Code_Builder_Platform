
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Vision – Web & App Creator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚀 AI Vision</h1>
    <p>Web & App Creator – Powered by Human-AI Collaboration</p>

      <textarea id="prompt" placeholder="Describe what you want to build..."></textarea>

      <iframe id="preview"></iframe>
      <textarea id="codeOutput" readonly></textarea>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 AI Vision Project – In collaboration with ChatGPT</p>
  </footer>
  <script src="script.js"></script>
