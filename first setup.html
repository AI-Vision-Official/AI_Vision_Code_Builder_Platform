<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brigitte's AI Builder</title>
  <style>
    body { font-family: Arial; padding: 1rem; background: #f0f0f0; }
    textarea, button, iframe, pre { width: 100%; margin-top: 1rem; }
    textarea { height: 100px; }
    iframe { height: 300px; background: white; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>🧠 AI Vision - AI Code Builder</h1>
  <textarea id="prompt">Create a responsive website with a form and a dark mode toggle.</textarea>
  <button onclick="generateCode()">✨ Generate Code</button>
  <pre id="result">Code will appear here...</pre>
  <h3>Live Preview:</h3>
  <iframe id="preview"></iframe>

  <script>
    async function generateCode() {
      const prompt = document.getElementById('prompt').value;
      const resultBox = document.getElementById('result');
      const previewFrame = document.getElementById('preview');

      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer YOUR_API_KEY_HERE"
        },
        body: JSON.stringify({
          model: "gpt-4",
          messages: [
            { role: "system", content: "You are a helpful AI that writes full HTML/CSS/JS webpages." },
            { role: "user", content: prompt }
          ],
          temperature: 0.3
        })
      });

      const data = await response.json();
      const code = data.choices[0].message.content;

      resultBox.textContent = code;

      // Show preview
      const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
      doc.open();
      doc.write(code);
      doc.close();
    }
  </script>
</body>
</html>
